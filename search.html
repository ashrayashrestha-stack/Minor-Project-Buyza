<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyza - Search Results</title>
  <link rel="icon" href="/Source/Shopping/Logo B.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <nav class="navbar">
      <div class="navbar-container">
        <a class="navbar-brand" href="shopping.html">
          <img src="Source/Shopping/Logo B.png" alt="Buyza">
        </a>
        <button class="navbar-toggle" id="navToggle" aria-label="Toggle navigation">
        </button>
        <div class="navbar-menu" id="navbarMenu">
          <ul class="navbar-nav">
            <li><a class="nav-link" href="shopping.html">Home</a></li>
            <li><a class="nav-link" href="shopping.html">Todays Special</a></li>
            <li><a class="nav-link" href="FAQ.html">FAQ</a></li>
            <li class="nav-dropdown">
              <a class="nav-link dropdown-toggle" href="#">Categories</a>
              <ul class="dropdown-menu">
                <li><a href="tools-diys-toys.html">Tools, DIYs, Toys</a></li>
                <li><a href="home-lifestyle-art.html">Home, Lifestyle, Art</a></li>
                <li><a href="electronic-accessories.html">Electronic Accessories</a></li>
                <li><a href="beauty-products.html">Beauty Products</a></li>
              </ul>
            </li>
          </ul>
        </div>
        <form class="search-form" role="search" onsubmit="return goToSearchPage(event)">
          <input class="search-input" type="search" id="searchInput" placeholder="🔍 Search" autocomplete="off">
          <button class="search-btn" type="submit">Search</button>
        </form>
        <a class="cart-link" href="cart.html">
          <img class="cart-icon" src="/Source/e46e34187c03f703c6f7ce552ea76b63.png" alt="Cart">
        </a>
        <button class="theme-btn" onclick="toggleDarkMode(this)">🌙</button>
        <button class="login-btn" id="loginBtn" onclick="toggleLogin()">👤</button>
        <div class="profile-menu" id="profileMenu">
          <button class="profile-btn" onclick="toggleDropdown()">👤 ▾</button>
          <div class="dropdown-menu profile-dropdown" id="profileDropdown">
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#" onclick="logOut()">Log Out</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <section class="items-section">
    <h2 class="section-title" id="searchHeading">Search Results</h2>
    <div class="card-grid" id="searchResultsList">
      <h3>Loading...</h3>
    </div>
  </section>

  <div class="login-overlay" id="addedToCartOverlay">
    <div class="login-box">
      <button class="login-close" onclick="closeAddedToCart()">x</button>
      <h2>Added to Cart!</h2>
      <p class="order-confirm-text" id="addedToCartText"></p>
      <button class="btn btn-warning login-submit" type="button" onclick="closeAddedToCart()">OK</button>
    </div>
  </div>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <button class="login-close" onclick="toggleLogin()">x</button>
      <h2>Login</h2>
      <form onsubmit="return handleLogin(event)">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>

        <button type="submit" class="btn btn-warning login-submit">Login</button>
      </form>
    </div>
  </div>


  <footer class="site-footer">
    <p>&copy; 2026 Buyza. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
